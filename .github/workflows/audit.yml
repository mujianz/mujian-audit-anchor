name: Mujian External Audit

on:
  create:
  schedule:
    # Monday 09:07 Asia/Shanghai = Monday 01:07 UTC
    - cron: "7 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mujian-audit-main
  cancel-in-progress: false

jobs:
  audit:
    if: >
      github.event_name != 'create' ||
      (
        github.event.ref_type == 'branch' &&
        startsWith(github.event.ref, 'audit-input/')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Run external audit
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.event.ref }}
          EVENT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          python3 <<'PYEOF'
          import os, json, hashlib, pathlib, subprocess
          from datetime import datetime, timezone, timedelta

          event = os.environ["EVENT_NAME"]
          event_ref = os.environ.get("EVENT_REF", "")
          event_sha = os.environ["EVENT_SHA"]
          run_id = os.environ["RUN_ID"]
          run_attempt = os.environ["RUN_ATTEMPT"]

          def sha256_text(s):
              return hashlib.sha256(s.encode("utf-8")).hexdigest()

          def read_json(path):
              with open(path, "r", encoding="utf-8") as f:
                  return json.load(f)

          def iso_week(dt):
              return dt.strftime("%G-W%V")

          policy = read_json("policy/policy.json")
          # The audited week: for create events it comes from the branch name;
          # for the weekly bell it is the PREVIOUS ISO week (VPS snapshots Monday
          # 08:50 CST covering last week; schedule fires Monday 09:07 CST).
          target_week = iso_week(datetime.now(timezone.utc) - timedelta(days=7))
          week = target_week
          input_path = None

          if event == "create":
              # fix#1: event.ref = "refs/heads/audit-input/2026-W39-<nonce>"
              branch = event_ref
              if branch.startswith("refs/heads/"):
                  branch = branch[len("refs/heads/"):]
              rest = branch[len("audit-input/"):]
              parts = rest.split("-")
              if len(parts) < 2:
                  raise SystemExit("invalid audit-input branch name: " + branch)
              week = parts[0] + "-" + parts[1]
              # fix#3: file inside branch is always audit-input/<week>.json
              input_path = pathlib.Path("audit-input") / (week + ".json")
              if not input_path.exists():
                  raise SystemExit("missing audit input file: " + str(input_path))

          records = []
          input_present = False
          if input_path is not None and input_path.exists():
              data = read_json(input_path)
              if str(data.get("schema_version")) != "1":
                  raise SystemExit("audit input schema mismatch")
              if data.get("week") != week:
                  raise SystemExit("audit input week mismatch")
              records = data.get("records", [])
              input_present = True
              allowed = {
                  "item_hash", "task_hash", "delivery_hash", "status",
                  "level", "gate_result", "gate_hash", "evidence_hash",
                  "declared_error", "blind_spot",
              }
              for r in records:
                  if set(r.keys()) - allowed:
                      raise SystemExit("public input contains forbidden field")
              # empty records is legitimate (quiet week): the receipt rings
              # with sampled=0 so the chain is visibly alive.

          # External salt: assigned by GitHub, never by VPS.
          salt = f"{run_id}:{run_attempt}:{event_sha}"
          ranked = []
          for r in records:
              item_hash = str(r.get("item_hash", ""))
              if not item_hash:
                  continue
              ranked.append((sha256_text(f"{salt}:{item_hash}"), r))
          ranked.sort(key=lambda x: x[0])
          sample_size = int(policy.get("sample_size", 20))
          sample = [r for _, r in ranked[:sample_size]]
          n = len(sample)

          escaped = 0
          blind_spot = 0
          caught_before_external = 0
          sampled_bad = 0
          findings = []
          rules = policy.get("audit_rules", {})
          for r in sample:
              failures = []
              if r.get("status") == "done" and not r.get("gate_hash"):
                  failures.append("done_without_gate")
              if r.get("status") == "done" and r.get("gate_result") != "PASS":
                  failures.append("done_gate_not_pass")
              if r.get("status") == "done" and not r.get("evidence_hash"):
                  failures.append("done_without_evidence")
              if r.get("blind_spot") is True:
                  failures.append("declared_blind_spot")
              if failures:
                  sampled_bad += 1
                  if r.get("declared_error", "none") == "none":
                      escaped += 1
                      source = "external_audit"
                  else:
                      caught_before_external += 1
                      source = "existing_error_ledger"
                  findings.append({
                      "item_hash": r.get("item_hash"),
                      "finding": failures,
                      "source": source,
                  })
              if r.get("status") == "done" and not r.get("evidence_hash"):
                  blind_spot += 1

          # fix#2 + fix#4 (final semantics): the weekly bell asks one
          # question - did the VPS deliver its snapshot branch this cycle?
          # Receipts may still sit unmerged (that's the boss's pending
          # action, not a missing audit), so we check remote refs, not main.
          receipt_files = sorted(pathlib.Path("audit/receipts").glob("*.json")) if pathlib.Path("audit/receipts").exists() else []
          audit_missing = 0
          skip_pr = False
          previous_receipt_hash = None
          if receipt_files:
              previous_receipt_hash = read_json(receipt_files[-1]).get("receipt_hash")
          if event == "schedule":
              repo = os.environ.get("REPO_SLUG", "")
              try:
                  check = subprocess.run(
                      ["gh", "api", f"repos/{repo}/git/matching-refs/heads/audit-input/{week}-",
                       "--jq", ".[].ref"],
                      capture_output=True, text=True, timeout=30)
                  delivered = f"refs/heads/audit-input/{week}-" in (check.stdout or "")
              except Exception:
                  delivered = False  # inconclusive = alarm (fail loud, never silent)
              if delivered:
                  skip_pr = True   # create event already handled this cycle
              else:
                  audit_missing = 1
          else:  # create / workflow_dispatch
              audit_missing = 0

          def ratio(x, d):
              return None if d < int(policy.get("ratio_min_sample", 20)) else round(x / d, 6)

          status_line = "AUDIT_MISSING" if audit_missing else "OK"
          pathlib.Path("/tmp/skip_pr").write_text("1" if skip_pr else "0", encoding="utf-8")
          receipt = {
              "schema_version": "1",
              "policy_version": policy["policy_version"],
              "week": week,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "event": event,
              "event_sha": event_sha,
              "run_id": run_id,
              "input_branch": event_ref if event == "create" else None,
              "sampled": n,
              "escaped": escaped,
              "blind_spot": blind_spot,
              "audit_missing": audit_missing,
              "status": status_line,
              "escaped_rate": ratio(escaped, n),
              "blind_spot_rate": ratio(blind_spot, n),
              "sampled_bad": sampled_bad,
              "caught_before_external": caught_before_external,
              "previous_receipt_hash": previous_receipt_hash,
              "findings": findings,
          }
          body = json.dumps(receipt, ensure_ascii=False, sort_keys=True,
                            separators=(",", ":"))
          # receipt_hash covers everything except the hash field itself
          receipt["receipt_hash"] = sha256_text(body)

          pathlib.Path("/tmp").mkdir(exist_ok=True)
          pathlib.Path(f"/tmp/receipt-{week}.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8")
          manifest = {
              "schema_version": "1",
              "week": week,
              "generated_at": receipt["generated_at"],
              "source_event_sha": event_sha,
              "run_id": run_id,
              "sample_size": n,
              "sampled_ids": [r.get("item_hash") for r in sample],
              "input_count": len(records),
              "sample_algorithm": policy["sample_algorithm"],
          }
          pathlib.Path("/tmp/manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8")
          print(json.dumps({
              "week": week, "sampled": n, "escaped": escaped,
              "blind_spot": blind_spot, "audit_missing": audit_missing,
              "status": status_line, "receipt_hash": receipt["receipt_hash"],
          }, ensure_ascii=False))
          PYEOF

      - name: Create audit PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$(cat /tmp/skip_pr)" = "1" ]; then
            echo "This cycle's input was already audited by the create-event run; skipping."
            exit 0
          fi
          WEEK=$(python3 - <<'PY'
          import pathlib
          for p in sorted(pathlib.Path("/tmp").glob("receipt-*.json")):
              print(p.stem[len("receipt-"):])
          PY
          | tail -n1)
          MISSING=$(python3 -c "import json,sys; print(json.load(open('/tmp/receipt-%s.json' % '$WEEK'))['audit_missing'])")
          if [ "$MISSING" = "1" ]; then TITLE="AUDIT_MISSING ${WEEK}"; else TITLE="AUDIT ${WEEK}"; fi
          BRANCH="audit-result/${WEEK}-${EVENT_SHA:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -b "$BRANCH" origin/main
          mkdir -p audit/manifests audit/receipts
          cp /tmp/manifest.json "audit/manifests/${WEEK}.json"
          cp "/tmp/receipt-${WEEK}.json" "audit/receipts/${WEEK}.json"
          git add "audit/manifests/${WEEK}.json" "audit/receipts/${WEEK}.json"
          git commit -m "audit: ${TITLE}" || true
          git push origin "$BRANCH"
          if gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create --repo "$REPO" --base main --head "$BRANCH" \
              --title "$TITLE" \
              --body "Automated external audit receipt. Human (mujianz) approval required before merge."
          fi
